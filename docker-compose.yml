version: "3.9"
services:
  db:
    image: postgres:17
    container_name: fastapi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: fastapi_app
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgresql://app:app_password@db:5432/app_db"
      SECRET_KEY: "change_me"
    ports:
      - "8000:8000"
    volumes:
      - ./:/app

volumes:
  postgres_data:
